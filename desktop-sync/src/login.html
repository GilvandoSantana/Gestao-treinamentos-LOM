<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Sincronização com a Nuvem</title>
<style>
  :root {
    --navy: #1a2332;
    --orange: #e8772e;
    --teal: #2d9f7f;
    --warm-gray: #f4f1ed;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--warm-gray);
    color: var(--navy);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  .card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    padding: 32px;
    width: 380px;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .header img { width: 40px; height: 40px; }
  .header h1 { font-size: 16px; margin: 0; line-height: 1.3; }
  .header p { font-size: 12px; color: #888; margin: 2px 0 0; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    margin: 14px 0 6px;
    color: #555;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--orange); }
  button {
    width: 100%;
    padding: 11px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    background: var(--orange);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.92; }
  button:disabled { opacity: 0.6; cursor: default; }
  button.secondary {
    background: transparent;
    color: var(--navy);
    border: 1.5px solid #ddd;
    margin-top: 8px;
  }
  .error {
    background: #fdecea;
    color: var(--danger);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-top: 14px;
    display: none;
  }
  .hint { font-size: 11px; color: #999; margin-top: 4px; }
  .step { display: none; }
  .step.active { display: block; }
  select {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  .folder-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .folder-row input { flex: 1; }
  .folder-row button {
    width: auto;
    margin: 0;
    white-space: nowrap;
    padding: 10px 14px;
  }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.5);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <img src="assets/icon.png" alt="" />
      <div>
        <h1>Sincronização com a Nuvem</h1>
        <p>Gestão de Controle dos Contratos</p>
      </div>
    </div>

    <!-- Passo 1: login -->
    <div class="step active" id="step-login">
      <label for="serverUrl">Endereço do site</label>
      <input id="serverUrl" type="text" />

      <label for="username">Usuário</label>
      <input id="username" type="text" autocomplete="username" placeholder="Deixe em branco para acesso mestre" />

      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" />

      <label for="two-factor-code">Código do autenticador (se 2FA estiver ativo)</label>
      <input id="two-factor-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" />

      <div class="error" id="login-error"></div>
      <button id="btn-login">Entrar</button>
    </div>

    <!-- Passo 2: escolher contrato (só aparece se a conta gerenciar mais de um) -->
    <div class="step" id="step-contract">
      <label for="contract">Qual contrato sincronizar?</label>
      <select id="contract"></select>
      <div class="error" id="contract-error"></div>
      <button id="btn-contract-continue">Continuar</button>
    </div>

    <!-- Passo 3: escolher pasta -->
    <div class="step" id="step-folder">
      <label for="folderPath">Pasta no seu computador</label>
      <div class="folder-row">
        <input id="folderPath" type="text" readonly placeholder="Nenhuma pasta escolhida" />
        <button id="btn-choose-folder" type="button">Escolher…</button>
      </div>
      <p class="hint">Os arquivos da Nuvem vão aparecer aqui, e o que você colocar nessa pasta vai subir sozinho.</p>
      <div class="error" id="folder-error"></div>
      <button id="btn-finish">Começar a sincronizar</button>
    </div>
  </div>

  <script src="login-renderer.js"></script>
</body>
</html>
