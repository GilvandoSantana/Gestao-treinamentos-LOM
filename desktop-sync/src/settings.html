<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Sincronização com a Nuvem</title>
<style>
  :root {
    --navy: #1a2332;
    --orange: #e8772e;
    --teal: #2d9f7f;
    --warm-gray: #f4f1ed;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--warm-gray);
    color: var(--navy);
    user-select: none;
    font-size: 13px;
  }
  .top {
    padding: 20px 24px 16px;
    background: white;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .top img { width: 34px; height: 34px; }
  .top h1 { font-size: 15px; margin: 0; }
  .top p { font-size: 12px; color: #888; margin: 2px 0 0; }
  .status-badge {
    margin-left: auto;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }
  .status-idle { background: #e8f7f1; color: var(--teal); }
  .status-syncing { background: #fff3e6; color: var(--orange); }
  .status-error { background: #fdecea; color: var(--danger); }
  .body { padding: 20px 24px; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
  }
  .row .label { color: #888; }
  .row .value { font-weight: 600; text-align: right; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  button {
    padding: 9px 14px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    background: white;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    color: var(--navy);
  }
  button.primary { background: var(--orange); color: white; border-color: var(--orange); }
  button:hover { opacity: 0.9; }
  .log {
    margin-top: 18px;
  }
  .log h2 { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.03em; margin: 0 0 8px; }
  .log-entry {
    padding: 7px 0;
    border-bottom: 1px solid #f2f2f2;
    font-size: 12px;
    display: flex;
    gap: 8px;
  }
  .log-entry .time { color: #aaa; white-space: nowrap; }
  .log-kind-upload { color: var(--teal); }
  .log-kind-download { color: var(--navy); }
  .log-kind-conflict { color: var(--orange); }
  .log-kind-error { color: var(--danger); }
  .empty { color: #aaa; text-align: center; padding: 20px 0; font-size: 12px; }
</style>
</head>
<body>
  <div class="top">
    <img src="assets/icon.png" alt="" />
    <div>
      <h1>Sincronização com a Nuvem</h1>
      <p id="account-line">—</p>
    </div>
    <span class="status-badge status-idle" id="status-badge">Em dia</span>
  </div>

  <div class="body">
    <div class="row"><span class="label">Contrato</span><span class="value" id="contract-value">—</span></div>
    <div class="row"><span class="label">Pasta</span><span class="value" id="folder-value">—</span></div>
    <div class="row"><span class="label">Última sincronização</span><span class="value" id="last-sync-value">—</span></div>

    <div class="actions">
      <button class="primary" id="btn-sync-now">Sincronizar agora</button>
      <button id="btn-open-folder">Abrir pasta</button>
      <button id="btn-change-folder">Trocar pasta</button>
      <button id="btn-disconnect">Desconectar</button>
    </div>

    <div class="log">
      <h2>Atividade recente</h2>
      <div id="log-list"><div class="empty">Nada por aqui ainda.</div></div>
    </div>
  </div>

  <script src="settings-renderer.js"></script>
</body>
</html>
