name: Alertas de Treinamentos Vencendo

on:
  schedule:
    # Todo dia às 12:00 UTC (~09:00 horário de Brasília)
    - cron: "0 12 * * *"
  workflow_dispatch: {}

jobs:
  trigger-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de alertas
        run: |
          if [ -z "${{ secrets.SITE_URL }}" ]; then
            echo "::error::O secret SITE_URL não está configurado neste repositório."
            exit 1
          fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::O secret CRON_SECRET não está configurado neste repositório."
            exit 1
          fi

          http_code=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            "${{ secrets.SITE_URL }}/api/cron/training-alerts" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")

          echo "Status HTTP: $http_code"
          echo "Resposta do servidor:"
          cat response.txt

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Endpoint retornou status $http_code"
            exit 1
          fi
