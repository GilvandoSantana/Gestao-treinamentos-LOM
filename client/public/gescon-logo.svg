<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .hex-stroke { fill: none; stroke: #E3A008; stroke-width: 5; }
      .hex-fill { fill: #14202B; }
      .mono { font-family: 'IBM Plex Sans', 'Arial', sans-serif; font-weight: 800; }
      .check { fill: none; stroke: #2C6E63; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Flat-top hexagon: safety/compliance frame -->
  <polygon class="hex-fill" points="120,14 206,62 206,158 120,206 34,158 34,62" />
  <polygon class="hex-stroke" points="120,14 206,62 206,158 120,206 34,158 34,62" />

  <!-- Monogram: G and C interlocked -->
  <text x="120" y="140" text-anchor="middle" class="mono" font-size="92" fill="#F5F3EE">GC</text>

  <!-- Checkmark accent tucked into lower-right of the hexagon, standing for verified/compliant contracts -->
  <polyline class="check" points="150,168 162,180 184,152" />
</svg>
